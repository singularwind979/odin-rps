<!DOCTYPE html>
<!-- Add appropriate language for your site -->
<html lang="en">
<head>
  <!-- `utf-8` is a character set including many universal characters -->
  <meta charset="utf-8">

  <!-- `viewport` ensures that items scale correctly on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- `title` sets the page title, which appears in the browser tab and search results.
   `author` sets your name and `description` provides a brief overview.
   Used by search engines. -->
  <title>Rock Paper Scissors</title>
  <meta name="author"      content="Singularwind">
  <meta name="description" content="Rock Paper Scissors game built for The Odin Project Foundations curriculum.">

  <!-- `og` stands for Open Graph, a protocol for sharing content on social media.
   Used to create a share card. -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Rock Paper Scissors">
  <meta property="og:title"       content="Rock Paper Scissors">
  <meta property="og:description" content="Rock Paper Scissors game built for The Odin Project Foundations curriculum.">

  <!-- CSS and JS entry points -->
  <link rel="stylesheet" href="css/index.css">
  <script type="module" src="dist/index.js"></script>
</head>

<body>
  <header>
    <h1 class="title">Rock, Paper, Scissors</h1>
  </header>

  <main>
    <section id="rules">
      <h2 class="title">Rules:</h2>
      <ul>
        <li>
          <span class="icon-rock">Rock</span>
          <span class="icon-greater-than">beats</span>
          <span class="icon-scissors">Scissors</span>
        </li>
        <li>
          <span class="icon-scissors">Scissors</span>
          <span class="icon-greater-than">beats</span>
          <span class="icon-paper">Papper</span>
        </li>
        <li>
          <span class="icon-paper">Papper</span>
          <span class="icon-greater-than">beats</span>
          <span class="icon-rock">Rock</span>
        </li>
      </ul>
    </section>

    <section id="playground">
      <h2 class="title">Playground:</h2>
      <div id="human">
        <div class="profile">
          <span class="icon-user">Human</span>
          <div>
            <label for="human-score">Score:</label>
            <output id="human-score">0</output>
          </div>
        </div>
        <div class="moves">
          <button class="icon-rock" type="button" data-move="rock"></button>
          <button class="icon-paper" type="button" data-move="paper"></button>
          <button class="icon-scissors" type="button" data-move="scissors"></button>
        </div>
      </div>

      <div id="control">
        <div>VS</div>
        <div>
          <label for="round">Round:</label>
          <output id="round">0</output>
        </div>
        <div class="actions">
          <button id="start-btn" class="icon-start" type="button">Start Game</button>
          <button id="reset-btn" class="icon-reset" type="button">New Game</button>
        </div>
      </div>

      <div id="computer">
        <div class="profile">
          <span class="icon-pc">Computer</span>
          <div>
            <label for="computer-score">Score:</label>
            <output id="computer-score">0</output>
          </div>
        </div>
        <div class="moves">
          <span class="icon-rock" data-move="rock"></span>
          <span class="icon-paper" data-move="paper"></span>
          <span class="icon-scissors" data-move="scissors"></span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <time datetime="2026">2026</time> Singularwind</p>
  </footer>
</body>
</html>
