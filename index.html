<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./css/index.css">
    <script defer type="module" src="./dist/index.js"></script>
</head>
<body class="flexbox-col g-5 font-ui bg-neutral-2 font-neutral">

    <h1 class="text-center font-5 font-bold">Rock Paper Scissors</h1>

    <div class="flexbox-row main-center cross-center g-4">

        <div id="computer" class="flexbox-col cross-center g-3 p-3 fixed-size-x-8 b-2 r-4 sh-2 bg-sky b-sky">
            <div class="flexbox-col cross-start g-1 p-2 b-1 r-2 bg-white b-neutral-2">
                <div>Role:<span class="role font-bold">Computer</span></div>
                <div>Score:<span class="score font-code font-bold font-sky-8">0</span></div>
            </div>
            <ul class="rps flexbox-row main-center g-2">
                <li><button class="p-1 fixed-size-4 b-1 r-pill sh-1 font-1 font-bold bg-sky-5 b-sky-5 font-white">Rock</button></li>
                <li><button class="p-1 fixed-size-4 b-1 r-pill sh-1 font-1 font-bold bg-sky-5 b-sky-5 font-white">Paper</button></li>
                <li><button class="p-1 fixed-size-4 b-1 r-pill sh-1 font-1 font-bold bg-sky-5 b-sky-5 font-white">Scissors</button></li>
            </ul>
        </div>

        <div class="font-3 font-bold font-neutral-5">VS</div>

        <div id="human" class="flexbox-col cross-center g-3 p-3 fixed-size-x-8 b-2 r-4 sh-2 bg-rose b-rose">
            <div class="flexbox-col cross-start g-1 p-2 b-1 r-2 bg-white b-neutral-2">
                <div>Role:<span class="role font-bold">Human</span></div>
                <div>Score:<span class="score font-code font-bold font-rose-8">0</span></div>
            </div>
            <ul class="rps flexbox-row main-center g-2">
                <li><button class="p-1 fixed-size-4 b-1 r-pill sh-1 font-1 font-bold bg-rose-5 b-rose-5 font-white">Rock</button></li>
                <li><button class="p-1 fixed-size-4 b-1 r-pill sh-1 font-1 font-bold bg-rose-5 b-rose-5 font-white">Paper</button></li>
                <li><button class="p-1 fixed-size-4 b-1 r-pill sh-1 font-1 font-bold bg-rose-5 b-rose-5 font-white">Scissors</button></li>
            </ul>
        </div>

    </div>

</body>
</html>
